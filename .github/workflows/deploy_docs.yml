name: Build and Deploy Documentation

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh jq

      - name: Download Doxygen Documentation Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Set the GH_TOKEN environment variable
        run: |
          # Define branches with documentation to be included
          branches=("core" "desktop" "gloves" "orbit" "handle" "duo" "chromadeck" "spark")

          for branch in "${branches[@]}"
          do
            artifact_name="doxygen-docs-${branch}"
            # Attempt to download each branch's artifact
            echo "Attempting to download ${artifact_name}"
            artifact_id=$(gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts | jq -r ".artifacts[] | select(.name==\"${artifact_name}\") | .id")

            if [ -n "$artifact_id" ]; then
              echo "Artifact ${artifact_name} exists, downloading..."
              mkdir -p docs/${branch}
              gh run download --name ${artifact_name} --dir docs/${branch} || echo "Failed to download artifact for branch: ${branch}"
            else
              echo "Artifact ${artifact_name} does not exist, skipping..."
            fi
          done

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures

      - name: Check URLs in Duo Infographic
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          cd docs/assets/infographics/vortex-duo
          # Extract URLs
          grep -oE 'https?://[^} )]+' infographic.tex | sort -u > urls.txt
          FAIL=0
          while read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -Ls -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" -ge 400 ]; then
              echo "BROKEN: $url -> $code"
              FAIL=1
            fi
          done < urls.txt
          if [ "$FAIL" -eq 1 ]; then
            echo "One or more infographic URLs are broken"
            exit 1
          fi

      - name: Build Vortex Duo Infographic
        run: |
          cd docs/assets/infographics/vortex-duo
          latexmk -pdf -interaction=nonstopmode infographic.tex
          test -f infographic.pdf
          latexmk -c

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # Second build of the same docs for https://lightshow.lol/wiki
      - name: Set baseurl for lightshow.lol/wiki
        run: |
          sed -i 's|^baseurl:.*|baseurl: "/wiki"|' docs/_config.yml
          if grep -q '^url:' docs/_config.yml; then
            sed -i 's|^url:.*|url: "https://lightshow.lol"|' docs/_config.yml
          else
            echo 'url: "https://lightshow.lol"' >> docs/_config.yml
          fi

      - name: Build with Jekyll for lightshow.lol/wiki
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site_wiki

      - name: Upload lightshow.lol/wiki artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: ./_site_wiki
          include-hidden-files: true
          retention-days: 7


  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-lightshow:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download lightshow.lol/wiki artifact
        uses: actions/download-artifact@v4
        with:
          name: wiki-site
          path: ./_site_wiki

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinned host key (no ssh-keyscan trust-on-first-use on every run)
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy to lightshow.lol/wiki
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete --delay-updates ./_site_wiki/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
